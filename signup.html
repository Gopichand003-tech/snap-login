<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | Snapchat</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body class="signup-page">

    <div class="signup-card">
        <!-- Header -->
        <div class="signup-header">

            <div class="yellow-logo">
                <img src="Screenshot 2026-09-29 181701.png" alt="Snapchat logo" width="30px">
            </div>

            <div>
                <h1>Sign Up</h1>
                <p>Step 1 of 3</p>
            </div>

        </div>
        <!-- Google -->
        <label class="section-label">
            Continue with Google
        </label>

        <button class="google-signup">

            <span class="google-icon">G</span>

            Sign up with Google

        </button>
        <!-- OR -->
        <div class="or-divider">

            <span></span>

            <p>OR</p>
            <span></span>

        </div>
        <!-- Name -->
        <label class="section-label">
            Name
        </label>

        <div class="row g-2">

            <div class="col-6">

                <input type="text" class="form-control" placeholder="First name">
            </div>

            <div class="col-6">

                <input type="text" class="form-control" placeholder="Last name (optional)">
            </div>

        </div>
        <!-- Birthday -->
        <label class="section-label mt-4">
            Birthday
        </label>

        <div class="row g-2">

            <div class="col-3">

                <select class="form-select">

                    <option selected>Month</option>
                    <option>January</option>
                    <option>February</option>
                    <option>March</option>
                    <option>April</option>
                    <option>May</option>
                    <option>June</option>
                    <option>July</option>
                    <option>August</option>
                    <option>September</option>
                    <option>October</option>
                    <option>November</option>
                    <option>December</option>

                </select>
            </div>

            <div class="col-5">
                <input type="number" class="form-control" placeholder="Day">
            </div>
            <div class="col-4">
                <input type="number" class="form-control" placeholder="Year">
            </div>

        </div>
        <!-- Username -->
        <label class="section-label mt-4">
            Username
        </label>
        <input type="text" class="form-control" placeholder="Enter your username">

        <p class="small-text">
            You can change this later
        </p>
        <!-- Password -->
        <label class="section-label mt-3">
            Password
        </label>

        <div class="password-box">

            <input type="password" class="form-control" placeholder="Enter a secure password">
            <span>◉</span>
        </div>
        <p class="small-text">
            Password must be at least 8 characters
        </p>
        <!-- Terms -->
        <p class="terms">

            By tapping "Agree and Continue" below, you agree to the
            <a href="#">Terms of Service</a> and acknowledge that you
            have read the
            <a href="#">Privacy Policy</a>.

        </p>
        <!-- Button -->
        <button class="agree-btn">
            Agree and Continue
        </button>
        <div class="back-login">
            Already have an account?
            <a href="index.html">Log In</a>
        </div>

    </div>

</body>

</html>
